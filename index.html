<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASY PRINT PORTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap');
        body { font-family: 'Poppins', 'Noto Sans Sinhala', sans-serif; }
    </style>
    <!-- PDF.js for reading pages -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen text-slate-800 pb-24">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-xs">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-print text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-slate-900 leading-tight">EASY PRINT</h1>
                    <p class="text-[11px] text-slate-400 font-medium">Smart Document Portal</p>
                </div>
            </div>
            <span class="text-xs bg-emerald-50 text-emerald-600 font-semibold px-2.5 py-1 rounded-full border border-emerald-100 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Online
            </span>
        </div>
    </header>

    <div class="max-w-xl mx-auto p-4 mt-2 space-y-4">
        
        <!-- Modern Upload Box -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 text-center relative overflow-hidden group">
            <input type="file" id="fileInput" multiple class="hidden" onchange="handleFiles(this.files)">
            <label for="fileInput" class="cursor-pointer flex flex-col items-center justify-center border-2 border-dashed border-indigo-200 hover:border-indigo-500 rounded-2xl p-8 bg-indigo-50/30 hover:bg-indigo-50/60 transition-all duration-300">
                <div class="w-14 h-14 bg-white rounded-2xl shadow-sm flex items-center justify-center text-indigo-600 text-2xl mb-3 group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <span class="font-bold text-slate-800 text-sm mb-1">פයිල්ස් මෙතැනට Upload කරන්න</span>
                <span class="text-xs text-slate-400">PDF, Word හෝ Images (Multiple files)</span>
            </label>
        </div>

        <!-- Files List Container -->
        <div id="fileList" class="space-y-3"></div>

        <!-- Order Summary & Checkout Card -->
        <div id="orderSummary" class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 hidden space-y-4">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 border-b border-slate-100 pb-3">
                <i class="fa-solid fa-receipt text-indigo-600"></i> මිල ගණන් සාරාංශය
            </h3>
            
            <div id="pricingDetails" class="space-y-2 text-xs text-slate-600 bg-slate-50 p-3 rounded-xl"></div>
            
            <div class="flex justify-between items-center px-1">
                <span class="font-semibold text-slate-600 text-sm">මුළු මුදල:</span>
                <span id="totalPrice" class="text-lg font-extrabold text-indigo-600">Rs. 0.00</span>
            </div>
            
            <div>
                <input type="text" id="customerName" placeholder="ඔබේ නම හෝ දුරකථන අංකය ඇතුළත් කරන්න" class="w-full px-4 py-3 text-sm bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500 focus:bg-white transition">
            </div>

            <button id="submitBtn" onclick="submitOrder()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-2xl text-sm transition shadow-lg shadow-indigo-200 flex items-center justify-center gap-2">
                <span>ඇණවුම යොමු කරන්න</span>
                <i class="fa-solid fa-arrow-right-long"></i>
            </button>
        </div>
    </div>

    <script>
        const CLOUDINARY_CLOUD_NAME = "YOUR_CLOUD_NAME"; // ඔබේ ක්ලවුඩ් නේම් එක මෙහි දමන්න
        const CLOUDINARY_PRESET = "YOUR_UPLOAD_PRESET"; // ඔබේ ප්‍රෙසට් එක මෙහි දමන්න

        let uploadedFiles = [];

        async function handleFiles(files) {
            for (let f of files) {
                let pageCount = 1;
                const fileName = f.name || "";
                const isPdfByExt = /\.pdf$/i.test(fileName);
                const isPdfMime = f.type === 'application/pdf';

                if (isPdfByExt || isPdfMime) {
                    try {
                        let arrayBuffer = await f.arrayBuffer();
                        let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        pageCount = pdf.numPages;
                    } catch (e) {
                        console.warn("PDF page count read failed, defaulting to 1:", e);
                        pageCount = 1;
                    }
                }

                uploadedFiles.push({
                    id: Date.now() + Math.random(),
                    fileObject: f,
                    name: fileName,
                    pages: pageCount,
                    printType: 'bw', 
                    sideType: 'single', 
                    copies: 1
                });
            }
            renderFileList();
        }

        function renderFileList() {
            const listEl = document.getElementById('fileList');
            const summaryEl = document.getElementById('orderSummary');
            listEl.innerHTML = '';

            if (uploadedFiles.length === 0) {
                summaryEl.classList.add('hidden');
                return;
            }

            summaryEl.classList.remove('hidden');

            uploadedFiles.forEach((item, index) => {
                listEl.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-100 text-xs">
                        <div class="flex justify-between items-start mb-3">
                            <span class="font-bold text-slate-700 truncate w-3/4 flex items-center gap-1.5">
                                <i class="fa-solid fa-file-lines text-indigo-500 text-sm"></i> ${item.name}
                            </span>
                            <button onclick="removeFile(${index})" class="text-slate-400 hover:text-red-500 p-1 transition"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                        <div class="grid grid-cols-2 gap-3 bg-slate-50/70 p-2.5 rounded-xl">
                            <div>
                                <label class="text-slate-400 block mb-1 font-medium">Print Type</label>
                                <select onchange="updateFileProp(${index}, 'printType', this.value)" class="w-full border border-slate-200 rounded-lg p-1.5 bg-white font-medium text-slate-700 focus:outline-none">
                                    <option value="bw" ${item.printType==='bw'?'selected':''}>B/W (Rs. 10/sheet)</option>
                                    <option value="color" ${item.printType==='color'?'selected':''}>Color (Rs. 50/page)</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-slate-400 block mb-1 font-medium">Sides</label>
                                <select onchange="updateFileProp(${index}, 'sideType', this.value)" class="w-full border border-slate-200 rounded-lg p-1.5 bg-white font-medium text-slate-700 focus:outline-none">
                                    <option value="single" ${item.sideType==='single'?'selected':''}>Single Side</option>
                                    <option value="double" ${item.sideType==='double'?'selected':''}>Double Side</option>
                                </select>
                            </div>
                        </div>
                    </div>
                `;
            });
            calculateTotal();
        }

        function updateFileProp(index, prop, val) {
            uploadedFiles[index][prop] = val;
            calculateTotal();
        }

        function removeFile(index) {
            uploadedFiles.splice(index, 1);
            renderFileList();
        }

        function calculateTotal() {
            let total = 0;
            let detailsHtml = '';

            uploadedFiles.forEach(item => {
                let cost = 0;
                let pages = item.pages || 1;
                
                if (item.printType === 'bw') {
                    let sheets = item.sideType === 'double' ? Math.ceil(pages / 2) : pages;
                    cost = sheets * 10 * item.copies;
                    detailsHtml += `<div class="flex justify-between"><span>${item.name} (B/W - ${sheets} sheets)</span> <span class="font-bold">Rs. ${cost}</span></div>`;
                } else {
                    cost = pages * 50 * item.copies;
                    detailsHtml += `<div class="flex justify-between"><span>${item.name} (Color - ${pages} pages)</span> <span class="font-bold">Rs. ${cost}</span></div>`;
                }
                total += cost;
            });

            document.getElementById('pricingDetails').innerHTML = detailsHtml || '<div class="text-slate-400">ෆයිල් එකක් තෝරන්න</div>';
            document.getElementById('totalPrice').innerText = `Rs. ${total}.00`;
        }

        async function uploadSingleFileToCloudinary(fileObj) {
            const fileName = fileObj.name || "";
            const isPdfByExt = /\.pdf$/i.test(fileName);
            const isImageByExt = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(fileName);
            
            const isImageMime = fileObj.type && fileObj.type.startsWith('image/');
            const isImage = isImageByExt || isImageMime;
            const primaryType = isImage ? 'image' : 'raw';
            
            const formData = new FormData();
            formData.append('file', fileObj);
            formData.append('upload_preset', CLOUDINARY_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${primaryType}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.secure_url) return data.secure_url;
            } catch (e) {
                console.warn(`Primary upload failed, trying fallback...`, e);
            }

            const fallbackType = primaryType === 'image' ? 'raw' : 'image';
            const fallbackData = new FormData();
            fallbackData.append('file', fileObj);
            fallbackData.append('upload_preset', CLOUDINARY_PRESET);

            const resFallback = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${fallbackType}/upload`, {
                method: 'POST',
                body: fallbackData
            });
            const dataFallback = await resFallback.json();
            
            if (!dataFallback.secure_url) {
                throw new Error(`${fileObj.name || "File"} Upload කිරීමට නොහැකි විය.`);
            }
            return dataFallback.secure_url;
        }

        async function submitOrder() {
            if (uploadedFiles.length === 0) {
                alert("කරුණාකර අවම වශයෙන් එක ෆයිල් එකක්වත් Upload කරන්න.");
                return;
            }
            const customerName = document.getElementById('customerName').value.trim();
            if (!customerName) {
                alert("කරුණාකර ඔබේ නම හෝ දුරකථන අංකය ඇතුළත් කරන්න.");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-2"></i> ඇණවුම යොමු වෙමින් පවතී...`;

            try {
                let processedFiles = [];

                for (let item of uploadedFiles) {
                    let fileUrl = await uploadSingleFileToCloudinary(item.fileObject);
                    
                    let sheets = item.printType === 'bw' && item.sideType === 'double' 
                        ? Math.ceil(item.pages / 2) 
                        : item.pages;
                        
                    let cost = item.printType === 'bw' 
                        ? sheets * 10 * item.copies 
                        : item.pages * 50 * item.copies;

                    processedFiles.push({
                        fileName: item.name,
                        fileUrl: fileUrl,
                        printType: item.printType,
                        sideType: item.sideType,
                        pages: item.pages,
                        copies: item.copies,
                        totalCost: cost
                    });
                }

                alert("ඔබගේ ඇණවුම සාර්ථකව යොමු කරන ලදී!");
                uploadedFiles = [];
                document.getElementById('customerName').value = '';
                renderFileList();

            } catch (error) {
                console.error("Order error:", error);
                alert("ඇණවුම යැවීමේදී දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>ඇණවුම යොමු කරන්න</span> <i class="fa-solid fa-arrow-right-long"></i>`;
            }
        }
    </script>
</body>
</html>
