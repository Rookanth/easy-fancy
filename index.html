<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASY FANCY - Staff Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @keyframes pulse-border {
            0%, 100% { border-color: #6366f1; }
            50% { border-color: #10b981; }
        }
        .new-order-card { animation: pulse-border 2s infinite; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 p-4">

    <!-- Header Section -->
    <header class="max-w-6xl mx-auto flex justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 mb-6">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-desktop text-2xl text-indigo-400"></i>
            <div>
                <h1 class="text-xl font-bold">EASY FANCY - Staff Terminal</h1>
                <p class="text-xs text-slate-400">GitHub Pages Cloud Print Engine</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
                <span class="text-xs text-emerald-400 font-semibold">Live System Online</span>
            </div>
        </div>
    </header>

    <audio id="orderSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <!-- Hidden Iframe for Direct Printing -->
    <iframe id="printIframe" style="display:none; width:0; height:0; border:0;"></iframe>

    <!-- Orders Grid -->
    <div class="max-w-6xl mx-auto">
        <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-10 text-slate-500">
                <i class="fa-solid fa-spinner animate-spin text-3xl mb-2"></i>
                <p>Orders Load වෙමින් පවතී...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "qr-scan-71b36.firebaseapp.com",
            projectId: "qr-scan-71b36",
            storageBucket: "qr-scan-71b36.appspot.com",
            messagingSenderId: "107...",
            appId: "1:107..."
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let initialLoad = true;

        db.collection("orders").orderBy("timestamp", "desc")
            .onSnapshot((snapshot) => {
                const container = document.getElementById('ordersContainer');
                
                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-16 bg-slate-800/50 rounded-2xl border border-slate-700">
                            <i class="fa-solid fa-inbox text-5xl text-slate-600 mb-3 block"></i>
                            <p class="text-slate-400 text-lg">දැනට නව Orders කිසිවක් නැත</p>
                        </div>`;
                    initialLoad = false;
                    return;
                }

                if (!initialLoad && snapshot.docChanges().some(change => change.type === "added")) {
                    playNotificationSound();
                }
                initialLoad = false;

                container.innerHTML = '';

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const orderId = doc.id;
                    const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'දැන්';

                    let filesHtml = '';
                    if(data.files && data.files.length > 0) {
                        data.files.forEach((f) => {
                            const isColor = f.printType === 'Color' || f.printType === 'Full Color';
                            const badgeStyle = isColor 
                                ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' 
                                : 'bg-slate-800 text-slate-300 border-slate-700';

                            const safeFileName = encodeURIComponent(f.fileName || 'file');

                            filesHtml += `
                                <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700 mb-2">
                                    <div class="flex justify-between items-start mb-1 gap-2">
                                        <span class="font-semibold text-xs text-indigo-300 truncate max-w-[170px]" title="${f.fileName}">📄 ${f.fileName}</span>
                                        <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${badgeStyle}">${f.printType}</span>
                                    </div>
                                    <div class="text-xs text-slate-400 space-y-0.5 mb-2">
                                        <p>පැති: <span class="text-slate-200 font-medium">${f.sideType}</span></p>
                                        <p>පිටු ගණන: <span class="text-slate-200 font-medium">${f.pages}</span> | කොපි: <span class="text-slate-200 font-medium">${f.copies}</span></p>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <button onclick="autoPrintFile('${f.fileUrl}', this)" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-1.5 px-2 rounded flex items-center justify-center gap-1 transition">
                                            <i class="fa-solid fa-print"></i> Print
                                        </button>
                                        <button onclick="downloadFile('${f.fileUrl}', '${safeFileName}')" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold py-1.5 px-2 rounded flex items-center justify-center gap-1 transition text-center">
                                            <i class="fa-solid fa-download"></i> Download
                                        </button>
                                    </div>
                                </div>
                            `;
                        });
                    }

                    const cardHtml = `
                        <div class="bg-slate-800 p-5 rounded-2xl border-2 border-slate-700 shadow-xl relative flex flex-col justify-between new-order-card">
                            <div>
                                <div class="flex justify-between items-start mb-3 border-b border-slate-700 pb-2">
                                    <div>
                                        <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                            <i class="fa-solid fa-user text-indigo-400"></i> ${data.customerName || 'Customer'}
                                        </h3>
                                        <span class="text-xs text-slate-400"><i class="fa-regular fa-clock"></i> ${time}</span>
                                    </div>
                                    <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs font-bold px-2.5 py-1 rounded-full">New Order</span>
                                </div>

                                <div class="space-y-2 mb-4">
                                    ${filesHtml}
                                </div>
                            </div>

                            <div>
                                <div class="flex justify-between items-center bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50 mb-4">
                                    <span class="text-xs font-semibold text-slate-400">මුළු එකතුව:</span>
                                    <span class="text-lg font-extrabold text-emerald-400">Rs. ${data.grandTotal ? data.grandTotal.toFixed(2) : '0.00'}</span>
                                </div>

                                <button onclick="deleteOrder('${orderId}')" class="w-full bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/40 font-semibold py-2 rounded-xl transition text-xs flex items-center justify-center gap-1.5">
                                    <i class="fa-solid fa-trash-can"></i> Order එක Delete කරන්න
                                </button>
                            </div>
                        </div>
                    `;

                    container.innerHTML += cardHtml;
                });
            });

        // GITHUB PAGES BLOB PRINT ENGINE
        async function autoPrintFile(fileUrl, btnElement) {
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Prep...`;
            btnElement.disabled = true;

            try {
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error('Fetch failed');
                
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                let iframe = document.getElementById('printIframe');
                iframe.src = blobUrl;

                iframe.onload = function() {
                    setTimeout(() => {
                        try {
                            iframe.contentWindow.focus();
                            iframe.contentWindow.print();
                        } catch (err) {
                            console.error("Print Error:", err);
                            window.open(fileUrl, '_blank');
                        } finally {
                            btnElement.innerHTML = originalText;
                            btnElement.disabled = false;
                            setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
                        }
                    }, 300);
                };

            } catch (err) {
                console.error("Blob Print Catch Error:", err);
                window.open(fileUrl, '_blank');
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            }
        }

        async function downloadFile(fileUrl, rawFileName) {
            const fileName = decodeURIComponent(rawFileName || 'downloaded-file');
            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (err) {
                window.open(fileUrl, '_blank');
            }
        }

        function playNotificationSound() {
            const sound = document.getElementById('orderSound');
            if (sound) { sound.play().catch(e => console.log('Audio autoplay blocked')); }
            alert("🔔 EASY FANCY වෙත අලුත් Print Order එකක් පැමිණියා!");
        }

        async function deleteOrder(docId) {
            if (confirm("මෙම Order එක මකා දැමීමට ඔබට විශ්වාසද?")) {
                try {
                    await db.collection("orders").doc(docId).delete();
                } catch (error) {
                    alert("Delete කිරීමට නොහැකි විය: " + error.message);
                }
            }
        }

        document.body.addEventListener('click', () => {
            const sound = document.getElementById('orderSound');
            if(sound) { sound.load(); }
        }, { once: true });
    </script>
</body>
</html>
