<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASY FANCY - Print Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js for reading pages -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-20">

    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-store mr-2"></i>EASY FANCY - Print Portal</h1>
        <p class="text-xs text-blue-100 mt-1">ඔබේ ලේඛන පහසුවෙන් මුද්‍රණය කරගන්න</p>
    </header>

    <div class="max-w-xl mx-auto p-4 mt-4">
        <!-- File Upload Box -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center mb-6">
            <input type="file" id="fileInput" multiple class="hidden" onchange="handleFiles(this.files)">
            <label for="fileInput" class="cursor-pointer flex flex-col items-center justify-center border-2 border-dashed border-blue-300 rounded-xl p-6 bg-blue-50/50 hover:bg-blue-50 transition">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-blue-600 mb-2"></i>
                <span class="font-bold text-slate-700 text-sm">פයිල්ස් මෙතැනට Upload කරන්න</span>
                <span class="text-xs text-slate-400 mt-1">PDF, Word, Images (Multiple files allowed)</span>
            </label>
        </div>

        <!-- Files List Container -->
        <div id="fileList" class="space-y-4 mb-6"></div>

        <!-- Order Summary & Checkout -->
        <div id="orderSummary" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hidden">
            <h3 class="font-bold text-slate-800 mb-3 text-sm border-b pb-2">මිල ගණන් සාරාංශය</h3>
            <div id="pricingDetails" class="space-y-2 text-xs text-slate-600 mb-4"></div>
            <div class="flex justify-between items-center font-bold text-base text-slate-800 border-t pt-3 mb-4">
                <span>මුළු මුදල:</span>
                <span id="totalPrice" class="text-blue-600">Rs. 0.00</span>
            </div>
            
            <div class="mb-4">
                <input type="text" id="customerName" placeholder="ඔබේ නම හෝ දුරකථන අංකය" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:border-blue-500">
            </div>

            <button onclick="submitOrder()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-sm transition shadow-sm">
                ඇණවුම යොමු කරන්න (Submit Order)
            </button>
        </div>
    </div>

    <script>
        const CLOUDINARY_CLOUD_NAME = "YOUR_CLOUD_NAME"; // ඔබේ ක්ලවුඩ් නේම් එක මෙහි දමන්න
        const CLOUDINARY_PRESET = "YOUR_UPLOAD_PRESET"; // ඔබේ ප්‍රෙසට් එක මෙහි දමන්න

        let uploadedFiles = [];

        async function handleFiles(files) {
            for (let f of files) {
                let pageCount = 1;
                const fileName = f.name || "";
                const isPdfByExt = /\.pdf$/i.test(fileName);
                const isPdfMime = f.type === 'application/pdf';

                if (isPdfByExt || isPdfMime) {
                    try {
                        let arrayBuffer = await f.arrayBuffer();
                        let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        pageCount = pdf.numPages;
                    } catch (e) {
                        console.warn("PDF page count read failed, defaulting to 1:", e);
                        pageCount = 1;
                    }
                }

                uploadedFiles.push({
                    id: Date.now() + Math.random(),
                    fileObject: f,
                    name: fileName,
                    pages: pageCount,
                    printType: 'bw', 
                    sideType: 'single', 
                    copies: 1
                });
            }
            renderFileList();
        }

        function renderFileList() {
            const listEl = document.getElementById('fileList');
            const summaryEl = document.getElementById('orderSummary');
            listEl.innerHTML = '';

            if (uploadedFiles.length === 0) {
                summaryEl.classList.add('hidden');
                return;
            }

            summaryEl.classList.remove('hidden');

            uploadedFiles.forEach((item, index) => {
                listEl.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-xs">
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-slate-700 truncate w-3/4"><i class="fa-solid fa-file-lines text-blue-500 mr-1"></i> ${item.name}</span>
                            <button onclick="removeFile(${index})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <div>
                                <label class="text-slate-400 block mb-1">Print Type</label>
                                <select onchange="updateFileProp(${index}, 'printType', this.value)" class="w-full border rounded-lg p-1.5 bg-slate-50">
                                    <option value="bw" ${item.printType==='bw'?'selected':''}>B/W (Rs. 10/sheet)</option>
                                    <option value="color" ${item.printType==='color'?'selected':''}>Color (Rs. 50/page)</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-slate-400 block mb-1">Sides</label>
                                <select onchange="updateFileProp(${index}, 'sideType', this.value)" class="w-full border rounded-lg p-1.5 bg-slate-50">
                                    <option value="single" ${item.sideType==='single'?'selected':''}>Single Side</option>
                                    <option value="double" ${item.sideType==='double'?'selected':''}>Double Side</option>
                                </select>
                            </div>
                        </div>
                    </div>
                `;
            });
            calculateTotal();
        }

        function updateFileProp(index, prop, val) {
            uploadedFiles[index][prop] = val;
            calculateTotal();
        }

        function removeFile(index) {
            uploadedFiles.splice(index, 1);
            renderFileList();
        }

        function calculateTotal() {
            let total = 0;
            let detailsHtml = '';

            uploadedFiles.forEach(item => {
                let cost = 0;
                let pages = item.pages || 1;
                
                if (item.printType === 'bw') {
                    let sheets = item.sideType === 'double' ? Math.ceil(pages / 2) : pages;
                    cost = sheets * 10 * item.copies;
                    detailsHtml += `<div>${item.name} (B/W - ${sheets} sheets): Rs. ${cost}</div>`;
                } else {
                    cost = pages * 50 * item.copies;
                    detailsHtml += `<div>${item.name} (Color - ${pages} pages): Rs. ${cost}</div>`;
                }
                total += cost;
            });

            document.getElementById('pricingDetails').innerHTML = detailsHtml || '<div>ෆයිල් එකක් තෝරන්න</div>';
            document.getElementById('totalPrice').innerText = `Rs. ${total}.00`;
        }

        async function uploadSingleFileToCloudinary(fileObj) {
            const fileName = fileObj.name || "";
            const isPdfByExt = /\.pdf$/i.test(fileName);
            const isImageByExt = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(fileName);
            
            const isImageMime = fileObj.type && fileObj.type.startsWith('image/');
            const isImage = isImageByExt || isImageMime;
            const primaryType = isImage ? 'image' : 'raw';
            
            const formData = new FormData();
            formData.append('file', fileObj);
            formData.append('upload_preset', CLOUDINARY_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${primaryType}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.secure_url) return data.secure_url;
            } catch (e) {
                console.warn(`Primary upload failed, trying fallback...`, e);
            }

            const fallbackType = primaryType === 'image' ? 'raw' : 'image';
            const fallbackData = new FormData();
            fallbackData.append('file', fileObj);
            fallbackData.append('upload_preset', CLOUDINARY_PRESET);

            const resFallback = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${fallbackType}/upload`, {
                method: 'POST',
                body: fallbackData
            });
            const dataFallback = await resFallback.json();
            
            if (!dataFallback.secure_url) {
                throw new Error(`${fileObj.name || "File"} Upload කිරීමට නොහැකි විය.`);
            }
            return dataFallback.secure_url;
        }

        async function submitOrder() {
            if (uploadedFiles.length === 0) {
                alert("කරුණාකර අවම වශයෙන් එක ෆයිල් එකක්වත් Upload කරන්න.");
                return;
            }
            const name = document.getElementById('customerName').value.trim();
            if (!name) {
                alert("කරුණාකර ඔබේ නම හෝ දුරකථන අංකය ඇතුළත් කරන්න.");
                return;
            }

            alert("ඇණවුම සකස් වෙමින් පවතී. කරුණාකර රැඳී සිටින්න...");
        }
    </script>
</body>
</html>
